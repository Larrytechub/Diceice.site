openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trading
    description: Paper-first trading intelligence operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [trading]
      summary: Get trading dashboard snapshot
      responses:
        "200":
          description: Current paper trading overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSnapshot"
  /scanner/signals:
    get:
      operationId: getScannerSignals
      tags: [trading]
      summary: Get ranked market scanner signals
      parameters:
        - name: market
          in: query
          required: false
          schema:
            type: string
            default: synthetic
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 4h]
            default: 15m
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
      responses:
        "200":
          description: Ranked scanner signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScannerSignal"
  /analysis:
    get:
      operationId: getSymbolAnalysis
      tags: [trading]
      summary: Get DTrader-style symbol analysis
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [1m, 5m, 15m, 1h, 4h]
            default: 15m
      responses:
        "200":
          description: Symbol analysis snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolAnalysis"
  /bulk/presets:
    get:
      operationId: getBulkPresets
      tags: [trading]
      summary: List bulk trade presets
      responses:
        "200":
          description: Available paper-trade presets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BulkPreset"
  /bulk/preview:
    post:
      operationId: previewBulkTrade
      tags: [trading]
      summary: Preview a paper-trade batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTradeInput"
      responses:
        "200":
          description: Paper-trade batch preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTradePreview"
  /paper/orders:
    get:
      operationId: getPaperOrders
      tags: [trading]
      summary: List recent paper orders
      responses:
        "200":
          description: Recent paper orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaperOrder"
    post:
      operationId: createPaperOrder
      tags: [trading]
      summary: Create a paper order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperOrderInput"
      responses:
        "201":
          description: Created paper order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperOrder"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSnapshot:
      type: object
      required: [balance, dailyPnl, openPositions, winRate, activeSignals, feedStatus, updatedAt]
      properties:
        balance: { type: number }
        dailyPnl: { type: number }
        openPositions: { type: integer }
        winRate: { type: number }
        activeSignals: { type: integer }
        feedStatus: { type: string }
        updatedAt: { type: string }
    ScannerSignal:
      type: object
      required: [symbol, name, direction, confidence, score, price, change, timeframe, reasons, status]
      properties:
        symbol: { type: string }
        name: { type: string }
        direction:
          type: string
          enum: [CALL, PUT]
        confidence: { type: integer, minimum: 0, maximum: 100 }
        score: { type: integer, minimum: 0, maximum: 100 }
        price: { type: number }
        change: { type: number }
        timeframe: { type: string }
        reasons:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [watch, ready, caution]
    SymbolAnalysis:
      type: object
      required: [symbol, name, timeframe, price, change, candles, indicators, levels, bias, updatedAt]
      properties:
        symbol: { type: string }
        name: { type: string }
        timeframe: { type: string }
        price: { type: number }
        change: { type: number }
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        indicators:
          type: object
          required: [rsi, macd, ema20, ema50, volatility]
          properties:
            rsi: { type: number }
            macd: { type: number }
            ema20: { type: number }
            ema50: { type: number }
            volatility: { type: number }
        levels:
          type: array
          items:
            $ref: "#/components/schemas/PriceLevel"
        bias:
          type: string
          enum: [bullish, bearish, neutral]
        updatedAt: { type: string }
    Candle:
      type: object
      required: [time, open, high, low, close]
      properties:
        time: { type: string }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
    PriceLevel:
      type: object
      required: [label, price, type]
      properties:
        label: { type: string }
        price: { type: number }
        type:
          type: string
          enum: [support, resistance, pivot]
    BulkPreset:
      type: object
      required: [id, name, description, symbols, risk, direction]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        symbols:
          type: array
          items: { type: string }
        risk: { type: string }
        direction:
          type: string
          enum: [CALL, PUT, AUTO]
    BulkTradeInput:
      type: object
      required: [symbols, direction, stake, duration, maxLoss]
      properties:
        symbols:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string }
        direction:
          type: string
          enum: [CALL, PUT, AUTO]
        stake: { type: number, minimum: 0.35, maximum: 1000 }
        duration: { type: integer, minimum: 1, maximum: 1440 }
        maxLoss: { type: number, minimum: 0.35, maximum: 10000 }
    BulkTradePreview:
      type: object
      required: [orders, totalStake, worstCaseLoss, withinRiskLimit, mode]
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/PaperOrder"
        totalStake: { type: number }
        worstCaseLoss: { type: number }
        withinRiskLimit: { type: boolean }
        mode: { type: string }
    PaperOrderInput:
      type: object
      required: [symbol, direction, stake, duration]
      properties:
        symbol: { type: string }
        direction:
          type: string
          enum: [CALL, PUT]
        stake: { type: number, minimum: 0.35, maximum: 1000 }
        duration: { type: integer, minimum: 1, maximum: 1440 }
    PaperOrder:
      type: object
      required: [id, symbol, direction, stake, duration, status, createdAt]
      properties:
        id: { type: string }
        symbol: { type: string }
        direction:
          type: string
          enum: [CALL, PUT]
        stake: { type: number }
        duration: { type: integer }
        status:
          type: string
          enum: [queued, simulated, settled]
        result:
          type: ["number", "null"]
        createdAt: { type: string }

